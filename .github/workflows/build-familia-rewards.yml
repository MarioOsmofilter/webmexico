name: Build Familia Rewards APK

on:
  push:
    branches: ['**']
    paths:
      - 'familia-rewards/**'
      - '.github/workflows/build-familia-rewards.yml'
  workflow_dispatch:

jobs:
  build-nextjs:
    name: Build Next.js App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: familia-rewards

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: familia-rewards/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup environment variables
        run: |
          echo "DATABASE_URL=postgresql://demo:demo@localhost:5432/familia_rewards" >> .env
          echo "DIRECT_URL=postgresql://demo:demo@localhost:5432/familia_rewards" >> .env
          echo "NEXTAUTH_URL=http://localhost:3000" >> .env
          echo "NEXTAUTH_SECRET=development-secret-key-minimum-32-characters-long-for-jwt-signing" >> .env
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyDemoKeyForBuildOnly" >> .env
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=familia-rewards-demo.firebaseapp.com" >> .env
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=familia-rewards-demo" >> .env
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=familia-rewards-demo.appspot.com" >> .env
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=123456789012" >> .env
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=1:123456789012:web:abcdef123456" >> .env
          echo "NEXT_PUBLIC_FIREBASE_VAPID_KEY=BDemoVapidKeyForBuildPurposesOnly1234567890" >> .env

      - name: Generate Prisma Client
        run: npx prisma generate
        continue-on-error: true

      - name: Build Next.js
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: familia-rewards/.next

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-nextjs

    defaults:
      run:
        working-directory: familia-rewards

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: familia-rewards/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup environment variables
        run: |
          echo "DATABASE_URL=postgresql://demo:demo@localhost:5432/familia_rewards" >> .env
          echo "DIRECT_URL=postgresql://demo:demo@localhost:5432/familia_rewards" >> .env
          echo "NEXTAUTH_URL=http://localhost:3000" >> .env
          echo "NEXTAUTH_SECRET=development-secret-key-minimum-32-characters-long-for-jwt-signing" >> .env
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyDemoKeyForBuildOnly" >> .env
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=familia-rewards-demo.firebaseapp.com" >> .env
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=familia-rewards-demo" >> .env
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=familia-rewards-demo.appspot.com" >> .env
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=123456789012" >> .env
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=1:123456789012:web:abcdef123456" >> .env
          echo "NEXT_PUBLIC_FIREBASE_VAPID_KEY=BDemoVapidKeyForBuildPurposesOnly1234567890" >> .env

      - name: Generate Prisma Client
        run: npx prisma generate
        continue-on-error: true

      - name: Build Next.js
        run: npm run build

      - name: Create basic web directory for Capacitor
        run: |
          mkdir -p public/assets
          echo '<!DOCTYPE html><html><head><title>Familia Rewards</title></head><body><h1>Familia Rewards</h1></body></html>' > public/index.html

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android || echo "Android platform already exists"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK Debug
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: familia-rewards-debug-apk
          path: familia-rewards/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            familia-rewards/android/app/build/outputs/logs/
            familia-rewards/android/build/outputs/logs/
          if-no-files-found: ignore

      - name: Success message
        run: |
          echo "✅ APK compilado exitosamente!"
          echo "📱 Descarga el APK desde la pestaña Artifacts"
